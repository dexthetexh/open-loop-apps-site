<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="description" content="{{TAGLINE}}" />
  <meta name="theme-color" content="#050b16" />
  <title>{{TITLE}} | Open Loop Apps</title>
  <link rel="icon" href="../../icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
  <script src="../../kit/ol-kit.js"></script>
</head>
<body>
  <main class="app">
    <header class="hud">
      <span class="stat"><small>SCORE</small><strong id="score">0</strong></span>
      <span class="stat"><small>BEST</small><strong id="best">0</strong></span>
      <span class="stat"><small>TIME</small><strong id="time">0.0</strong></span>
    </header>

    <section class="stage" id="stage" aria-label="Play area">
      <button class="target hidden" id="target" aria-label="Target"></button>
    </section>

    <!-- Start and game-over share one overlay -->
    <div class="overlay" id="overlay">
      <h1 id="overlayTitle">{{TITLE}}</h1>
      <p id="overlayText">{{TAGLINE}}</p>
      <button class="btn" id="playBtn">Play</button>
    </div>
  </main>
  <script src="./game.js"></script>
</body>
</html>
