<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06101d" />
  <meta name="description" content="ReelLoop — cast, hook and land trophy fish across three vistas." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ReelLoop" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css?v=5.1.0" />
  <title>ReelLoop | Open Loop Apps</title>
  <script src="../../kit/ol-kit.js"></script>
</head>
<body class="vista-sunny">
  <div class="app" id="app">
    <header class="hud">
      <div class="lvlBox" id="lvlBox" aria-label="Level">
        <div class="lvlNum" id="lvl">1</div>
        <div class="xpWrap">
          <div class="xpLabel" id="xpLabel">0 / 60 XP</div>
          <div class="xpBar"><div class="xpFill" id="xpFill"></div></div>
        </div>
      </div>
      <button class="coinPill" id="coinPill" aria-label="Coins — open shop">🪙 <span id="coins">0</span></button>
      <div class="hdrRight">
        <button class="iconBtn" id="shopBtn" aria-label="Tackle shop">🛒<span class="dot hidden" id="shopDot"></span></button>
        <button class="iconBtn" id="dexBtn" aria-label="Fishdex">🏆</button>
        <button class="iconBtn" id="setBtn" aria-label="Settings">⚙️</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="scene" aria-label="Fishing scene"></canvas>
      <button class="vistaPill" id="vistaPill" aria-label="Select vista"><span id="vistaPillText">☀️ Sunny Lake</span><span class="chev">▾</span></button>

      <div class="fightHud hidden" id="fightHud">
        <div class="fishTag"><span class="rar" id="fRarity">Common</span><span id="fName">???</span><span class="sta" id="fSta"></span></div>
        <div class="meter"><label>LANDING</label><div class="track"><div class="fill" id="distFill"></div></div></div>
        <div class="meter"><label>TENSION</label><div class="track" id="tenTrack"><div class="zone" id="zone"></div><div class="fill" id="tenFill"></div></div></div>
      </div>

      <div class="castMeter hidden" id="castMeter">
        <div class="castTrack"><div class="power"></div><div class="castGold" id="castGold"></div><div class="castNeedle" id="castNeedle"></div></div>
        <div class="castLbl"><span>SHORT</span><span id="castStat">PERFECT 0/0</span><span>FAR</span></div>
      </div>

      <div class="drillMeter hidden" id="drillMeter">
        <div class="drillTrack"><div class="drillFill" id="drillFill"></div></div>
        <div class="castLbl"><span>DRILLING</span><span id="holeMeta">HOLE USES 0/5</span></div>
      </div>

      <div class="callout" id="callout"></div>
      <div class="toast" id="toast"></div>
      <div class="dangerVignette" id="danger"></div>
    </div>

    <footer class="controls">
      <div class="hint" id="hint">&nbsp;</div>
      <div class="ctrlRow">
        <button class="btn hidden" id="secondaryBtn">Reel in</button>
        <button class="bigBtn" id="actionBtn">CAST</button>
      </div>
    </footer>
  </div>

  <!-- Bottom sheet (shop / dex / vista / settings) -->
  <div class="sheetWrap" id="sheetWrap">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheetHead"><div class="sheetTitle" id="sheetTitle">—</div><button class="iconBtn" id="sheetClose" aria-label="Close">✕</button></div>
      <div class="tabs" id="sheetTabs"></div>
      <div class="sheetBody" id="sheetBody"></div>
    </div>
  </div>

  <!-- Catch / result card -->
  <div class="cardWrap" id="cardWrap">
    <div class="card" id="card">
      <div class="cardTitle" id="cardTitle">Caught!</div>
      <div class="cardSub" id="cardSub">—</div>
      <canvas class="cardFish" id="cardFish"></canvas>
      <div class="weight" id="cardWeight"></div>
      <div class="badges" id="cardBadges"></div>
      <div class="rewards" id="cardRewards"></div>
      <button class="bigBtn" id="cardBtn">CONTINUE</button>
    </div>
  </div>

  <div class="iosNudge" id="iosNudge">
    <div style="font-size:1.5rem">📲</div>
    <div class="tx"><strong>Better on Home Screen</strong>Tap <b>Share</b> → <b>Add to Home Screen</b> for fullscreen &amp; faster loads.</div>
    <button class="btn" id="iosNudgeDismiss">Got it</button>
  </div>

  <script src="./core.js?v=5.1.0"></script>
  <script src="./game.js?v=5.1.0"></script>
</body>
</html>
